# Redeploy the site whenever its source changes on main (design tweaks, etc.).
# Data-only refreshes are deployed by sync.yml instead.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-1.outputs.page_url || steps.deploy-2.outputs.page_url || steps.deploy-3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply custom domain & absolute social URLs
        run: |
          CNAME="$(node -p "require('./config.json').cname || ''")"
          if [ -n "$CNAME" ]; then
            echo "$CNAME" > site/CNAME
            BASE="https://$CNAME"
          else
            BASE="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          node -e "const fs=require('fs');const f='site/index.html';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replaceAll('__SITE_URL__',process.argv[1]))" "$BASE"
          echo "site URL → $BASE"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub's Pages backend intermittently marks a deployment as
      # "Deployment failed, try again later." even when the artifact is fine;
      # a re-run of the identical build has always succeeded. Re-attempt the
      # deploy a couple of times with a short backoff before failing the job.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy-1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Back off before retry
        if: steps.deploy-1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Back off before final attempt
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy-3
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@v4
