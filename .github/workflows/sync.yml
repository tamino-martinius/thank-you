# Nightly: collect the full snapshot, distil the public graph, commit it,
# and redeploy the site with fresh data.
#
# Repository secrets (optional):
#   GH_PAT – a classic PAT (no scope needed for public data) for a 5000/hr rate
#            limit. Falls back to the built-in GITHUB_TOKEN.
name: Sync & deploy

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC nightly
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed data
  pages: write # deploy the site
  id-token: write # auth the Pages deploy

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Collect the full snapshot
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: npm run collect

      - name: Aggregate the public graph
        run: npm run aggregate

      - name: Commit refreshed data
        run: |
          git config user.name "thank-you-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/graph.json site/data/graph.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync gratitude data ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Apply custom domain & absolute social URLs
        run: |
          CNAME="$(node -p "require('./config.json').cname || ''")"
          if [ -n "$CNAME" ]; then
            echo "$CNAME" > site/CNAME
            BASE="https://$CNAME"
          else
            BASE="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          node -e "const fs=require('fs');const f='site/index.html';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replaceAll('__SITE_URL__',process.argv[1]))" "$BASE"
          echo "site URL → $BASE"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
