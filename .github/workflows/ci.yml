# Validate the code on every push and pull request: strict type-check, the unit
# test, and a syntax check of the zero-build site script. Pure static analysis —
# it never hits the GitHub API, so no token or secrets are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check, test & lint the site script
        run: npm run check
